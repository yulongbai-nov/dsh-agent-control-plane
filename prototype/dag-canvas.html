<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow DAG 视图 · mock（自动布局 + phase + 动画）</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f6f8; --panel:#ffffff; --fg:#171a1f; --muted:#667085; --line:#e4e7ec;
    --accent:#4f6bed; --accent2:#7c5cff; --ok:#12b76a; --bad:#f04438; --warn:#f79009; --chip:#f2f4f7;
    --lane:#eef2ff; --grid:#e9ecf2; --glow:rgba(79,107,237,.35); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0d12; --panel:#141821; --fg:#e8ebf2; --muted:#8f9aab;
    --line:#232a37; --accent:#7d94ff; --accent2:#a78bfa; --ok:#32d583; --bad:#f97066; --warn:#fdb022; --chip:#1a202b;
    --lane:#101827; --grid:#1a2130; --glow:rgba(125,148,255,.35); } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
  body.dark { --bg:#0b0d12; --panel:#141821; --fg:#e8ebf2; --muted:#8f9aab; --line:#232a37; --accent:#7d94ff;
    --accent2:#a78bfa; --ok:#32d583; --bad:#f97066; --warn:#fdb022; --chip:#1a202b; --lane:#101827; --grid:#1a2130;
    --glow:rgba(125,148,255,.35); }
  .app { max-width:1280px; margin:0 auto; padding:14px 16px 22px; }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .wf-title { font-weight:650; font-size:15px; }
  .wf-title small { color:var(--muted); font-weight:400; margin-left:6px; font-size:12px; }
  .spacer { flex:1; }
  .controls { display:flex; gap:6px; flex-wrap:wrap; }
  .ctl { border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:8px;
    padding:4px 10px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .ctl.on { border-color:var(--accent); color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--panel)); }
  .badge { font-size:11px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--muted); }
  .badge.live { color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .badge.ok { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); }

  /* run summary strip */
  .strip { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:9px 12px; margin-bottom:12px; }
  .strip .pct { font-variant-numeric:tabular-nums; font-weight:600; }
  .progress { flex:1; height:6px; border-radius:999px; background:var(--chip); overflow:hidden; }
  .progress > i { display:block; height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .5s ease; }
  .strip .meta { font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }

  /* canvas */
  .canvas { position:relative; height:560px; border:1px solid var(--line); border-radius:16px; overflow:hidden;
    background:
      radial-gradient(900px 420px at 20% 0%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%),
      radial-gradient(700px 380px at 90% 100%, color-mix(in srgb, var(--accent2) 7%, transparent), transparent 70%),
      var(--panel);
  }
  .canvas::before { content:""; position:absolute; inset:0;
    background-image:radial-gradient(var(--grid) 1px, transparent 1px); background-size:22px 22px; opacity:.8; }
  .lanes, .edges, .nodes { position:absolute; inset:0; }
  .lanes { pointer-events:none; transition:opacity .3s; }
  .lane { position:absolute; top:64px; bottom:28px; border-radius:14px; background:var(--lane);
    border:1px dashed color-mix(in srgb, var(--line) 80%, transparent); opacity:.75; }
  .lane .cap { position:absolute; top:-24px; left:8px; font-size:11px; letter-spacing:.04em; color:var(--muted);
    text-transform:uppercase; white-space:nowrap; }
  .lane .cap b { color:var(--fg); font-weight:600; }
  body.implicit .lane { background:transparent; border:none; }
  body.implicit .lane .cap { top:-22px; color:var(--muted); }

  svg.edges { width:100%; height:100%; overflow:visible; }
  .edge { fill:none; stroke:var(--line); stroke-width:1.6; transition:stroke .3s, opacity .3s; }
  .edge.flow { stroke-dasharray:5 7; animation:dash 1.1s linear infinite; }
  .edge.done { stroke:color-mix(in srgb, var(--ok) 65%, var(--line)); stroke-dasharray:none; }
  .edge.active { stroke:var(--accent); stroke-width:2.1; stroke-dasharray:6 8; animation:dash .75s linear infinite;
    filter:drop-shadow(0 0 4px var(--glow)); }
  .edge.cond { stroke-dasharray:2 6; }
  .edge.bad { stroke:var(--bad); animation:dash .6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-24; } }
  .arrowhead { fill:var(--line); transition:fill .3s; }
  .arrowhead.done { fill:var(--ok); } .arrowhead.active { fill:var(--accent); }

  .node { position:absolute; width:186px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:9px 11px; box-shadow:0 1px 0 rgba(16,24,40,.04), 0 8px 24px -18px rgba(16,24,40,.35);
    transition:transform .55s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .3s; will-change:transform; }
  .node .n-head { display:flex; align-items:center; gap:7px; }
  .node .n-ico { width:20px; height:20px; border-radius:6px; display:grid; place-items:center; font-size:11px;
    background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent); flex:none; transition:.3s; }
  .node .n-name { font-weight:600; font-size:13px; line-height:1.25; }
  .node .n-sub { color:var(--muted); font-size:11px; margin-top:3px; min-height:15px; }
  .node .n-chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .node .chip { font-size:10px; border-radius:5px; padding:1px 5px; background:var(--chip); color:var(--muted);
    display:flex; align-items:center; gap:3px; }
  .node .chip.file { color:var(--accent); }
  .node .chip.tool { color:var(--warn); }
  .node .n-foot { display:flex; justify-content:space-between; align-items:center; margin-top:7px;
    font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .node .status { display:flex; align-items:center; gap:4px; }
  .node .dot { width:6px; height:6px; border-radius:50%; background:var(--muted); }
  .node.running { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent),
    0 10px 30px -16px var(--glow); }
  .node.running .n-ico { background:var(--accent); color:#fff; }
  .node.running .dot { background:var(--accent); animation:pulse 1.1s infinite; }
  .node.running::after { content:""; position:absolute; inset:-1px; border-radius:12px; padding:1px;
    background:linear-gradient(120deg, transparent 20%, var(--accent) 45%, var(--accent2) 55%, transparent 80%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; animation:sweep 1.6s linear infinite; pointer-events:none; }
  @keyframes sweep { to { background-position:300% 0; } }
  @keyframes pulse { 50% { opacity:.25; } }
  .node.done { border-color:color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .node.done .n-ico { background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok); }
  .node.done .dot { background:var(--ok); }
  .node.failed { border-color:var(--bad); animation:shake .5s ease; }
  .node.failed .n-ico { background:color-mix(in srgb, var(--bad) 16%, transparent); color:var(--bad); }
  .node.failed .dot { background:var(--bad); }
  @keyframes shake { 20%,60% { transform:translateX(-3px); } 40%,80% { transform:translateX(3px); } }
  .node.pop { animation:pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform:scale(.96); } to { transform:scale(1); } }

  .node.input { width:150px; border-style:dashed; }
  .node.input .n-ico { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
  .node.res { width:158px; padding:7px 9px; border-style:dashed; opacity:.95; }
  .node.res .n-name { font-size:12px; font-weight:500; font-family:ui-monospace, Menlo, monospace; }
  .node.res .n-ico { background:color-mix(in srgb, var(--accent2) 14%, transparent); color:var(--accent2); }

  .legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:11px; margin-top:10px; }
  .legend i { display:inline-block; width:16px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .legend .run { background:var(--accent); } .legend .done { background:var(--ok); }
  .legend .cond { background:linear-gradient(90deg,var(--muted) 40%, transparent 40%); }
  .legend .loop { background:var(--accent2); }
  .hint { color:var(--muted); font-size:11px; margin-top:4px; }
</style></head>
<body>
<div class="app">
  <header>
    <div class="wf-title">review-demo <small>软执行 · workflow-lite · 自动布局</small></div>
    <span class="badge live" id="runBadge">运行中</span>
    <span class="badge" id="backendBadge">canvas 图 → DAG 视图</span>
    <span class="spacer"></span>
    <div class="controls">
      <button class="ctl on" id="phasesBtn">显示 phase</button>
      <button class="ctl" id="themeBtn">深色</button>
      <button class="ctl" id="layoutBtn">重新布局</button>
      <button class="ctl" id="replayBtn">▶ 重播</button>
    </div>
  </header>

  <div class="strip">
    <span class="pct" id="pct">0%</span>
    <div class="progress"><i id="bar"></i></div>
    <span class="meta" id="meta">0/4 步 · 0.0s</span>
    <span class="meta" id="cur">等待开始</span>
  </div>

  <div class="canvas" id="canvas">
    <div class="lanes" id="lanes"></div>
    <svg class="edges" id="edges" viewBox="0 0 1248 560" preserveAspectRatio="none"></svg>
    <div class="nodes" id="nodes"></div>
  </div>

  <div class="legend">
    <span><i class="run"></i>进行中（节点呼吸/流动虚线）</span>
    <span><i class="done"></i>已完成</span>
    <span><i class="cond"></i>条件边（仅 fail 走）</span>
    <span><i class="loop"></i>回边（修复 → 复审）</span>
    <span>布局：phase 列 + 拓扑深度；换 phase 或加节点自动重排</span>
  </div>
  <div class="hint">真机实现：布局用 ELK layered（MIT），节点/边状态来自 run state；动画纯 CSS/SVG，尊重 prefers-reduced-motion；消息流里先折叠成一行摘要，展开即此视图。</div>
</div>

<script>
const GRAPH = {
  phases: [
    { id: 'p1', title: '收集', x: 0, w: 250 },
    { id: 'p2', title: '审查', x: 250, w: 260 },
    { id: 'p3', title: '修复', x: 510, w: 250 },
    { id: 'p4', title: '结论', x: 760, w: 250 },
  ],
  nodes: [
    { id: 'goal', kind: 'input', phase: 0, title: '评审目标', sub: '输入节点 · 执行前问用户', chips: [], x: 22, y: 200, w: 150, icon: '?' },
    { id: 'collect', kind: 'step', phase: 0, title: '收集变更上下文', sub: '读 git diff，整理变更清单', chips: [{ t: 'file', v: 'context.md' }, { t: 'tool', v: 'bash' }], x: 96, y: 110, icon: '1' },
    { id: 'review', kind: 'step', phase: 1, title: '独立审查', sub: '对照检查清单，给 VERDICT', chips: [{ t: 'file', v: 'review.md' }, { t: 'tool', v: 'read' }, { t: 'text', v: '评审标准' }], x: 330, y: 110, icon: '2' },
    { id: 'fix', kind: 'step', phase: 2, title: '按理由修复', sub: '仅 fail 分支；逐条修', chips: [{ t: 'tool', v: 'edit' }], x: 575, y: 110, icon: '3' },
    { id: 'finalize', kind: 'step', phase: 3, title: '给出最终结论', sub: 'pass 后汇总给用户', chips: [{ t: 'file', v: 'verdict.md' }], x: 820, y: 110, icon: '4' },
    { id: 'r-context', kind: 'res', phase: 0, title: 'context.md', sub: '产出 · 步骤 1 写，步骤 2 读', chips: [], x: 96, y: 400, icon: '▤' },
    { id: 'r-review', kind: 'res', phase: 1, title: 'review.md', sub: '产出 · 审查写，修复/结论读', chips: [], x: 330, y: 400, icon: '▤' },
    { id: 'r-verdict', kind: 'res', phase: 3, title: 'verdict.md', sub: '终点产出', chips: [], x: 820, y: 400, icon: '▤' },
    { id: 'r-rubric', kind: 'res', phase: 1, title: '评审标准', sub: '只读资源 · text', chips: [], x: 330, y: 260, icon: '▤' },
  ],
  edges: [
    { from: 'goal', to: 'collect', kind: 'dashed' },
    { from: 'collect', to: 'review', kind: 'solid' },
    { from: 'review', to: 'fix', kind: 'cond', label: 'fail' },
    { from: 'fix', to: 'review', kind: 'loop', label: '回边' },
    { from: 'review', to: 'finalize', kind: 'solid', label: 'pass' },
    { from: 'collect', to: 'r-context', kind: 'write' },
    { from: 'r-context', to: 'review', kind: 'read' },
    { from: 'review', to: 'r-review', kind: 'write' },
    { from: 'r-review', to: 'fix', kind: 'read' },
    { from: 'r-review', to: 'finalize', kind: 'read' },
    { from: 'review', to: 'r-rubric', kind: 'read' },
  ],
};

const SCRIPT = [
  { t: 700,  run: 'collect',   label: '读取变更' },
  { t: 1700, done: 'collect',  label: '收集完成' },
  { t: 2100, run: 'review',    label: '独立审查（第 1 轮）' },
  { t: 3600, fail: 'review',   label: '审查不通过：3 处必须修' },
  { t: 4200, run: 'fix',       label: '按理由修复' },
  { t: 5300, done: 'fix',      label: '修复完成，回到审查' },
  { t: 5700, run: 'review',    label: '复审（第 2 轮）' },
  { t: 7000, done: 'review',   label: '复审通过' },
  { t: 7400, run: 'finalize',  label: '汇总结论' },
  { t: 8400, done: 'finalize', label: '完成' },
];

const $ = (id) => document.getElementById(id);
const nodeEls = new Map();
const edgeEls = new Map();
let light = !document.body.classList.contains('dark');

function svgEl(name, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', name);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  return el;
}

function render() {
  // lanes
  const lanes = $('lanes'); lanes.innerHTML = '';
  GRAPH.phases.forEach((p, i) => {
    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.style.left = (p.x + 14) + 'px';
    lane.style.width = (p.w - 28) + 'px';
    lane.innerHTML = `<span class="cap"><b>phase ${i + 1}</b> · ${p.title}</span>`;
    lanes.appendChild(lane);
  });
  // nodes
  const nodes = $('nodes'); nodes.innerHTML = '';
  for (const n of GRAPH.nodes) {
    const el = document.createElement('div');
    el.className = 'node' + (n.kind === 'input' ? ' input' : '') + (n.kind === 'res' ? ' res' : '');
    el.id = 'n-' + n.id;
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    if (n.w) el.style.width = n.w + 'px';
    el.innerHTML = `
      <div class="n-head"><span class="n-ico">${n.icon}</span><span class="n-name">${n.title}</span></div>
      <div class="n-sub">${n.sub || ''}</div>
      ${n.chips?.length ? `<div class="n-chips">${n.chips.map((c) => `<span class="chip ${c.t}">${c.v}</span>`).join('')}</div>` : ''}
      <div class="n-foot"><span class="status"><span class="dot"></span><span class="st">待运行</span></span><span class="dur"></span></div>`;
    nodes.appendChild(el);
    nodeEls.set(n.id, el);
    if (n.id === 'r-rubric') { const st = el.querySelector('.st'); if (st) st.textContent = '只读'; }
    if (n.kind === 'res' && !['r-rubric'].includes(n.id)) { const st = el.querySelector('.st'); if (st) st.textContent = '待产出'; }
  }
  renderEdges();
}

function center(id) {
  const n = GRAPH.nodes.find((x) => x.id === id);
  const w = n.w || (n.kind === 'res' ? 158 : 186);
  return { x: n.x + w / 2, y: n.y + 34 };
}

function pathFor(e) {
  const a = center(e.from), b = center(e.to);
  if (e.kind === 'loop') {
    // back edge: curve above the row
    return `M ${a.x} ${a.y - 34} C ${a.x} ${a.y - 150}, ${b.x} ${b.y - 150}, ${b.x} ${b.y - 34}`;
  }
  if (e.kind === 'write' || e.kind === 'read') {
    const sy = a.y, ty = b.y;
    return `M ${a.x} ${sy} C ${a.x} ${(sy + ty) / 2}, ${b.x} ${(sy + ty) / 2}, ${b.x} ${ty}`;
  }
  const sx = a.x + 93, tx = b.x - 93;
  return `M ${sx} ${a.y} C ${sx + 70} ${a.y}, ${tx - 70} ${b.y}, ${tx} ${b.y}`;
}

function renderEdges() {
  const svg = $('edges'); svg.innerHTML = '';
  const defs = svgEl('defs');
  const marker = svgEl('marker', { id: 'arr', viewBox: '0 0 10 10', refX: '8', refY: '5', markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse' });
  const path = svgEl('path', { d: 'M 0 0 L 10 5 L 0 10 z', class: 'arrowhead' });
  marker.appendChild(path); defs.appendChild(marker); svg.appendChild(defs);

  for (const e of GRAPH.edges) {
    const p = svgEl('path', { d: pathFor(e), class: 'edge ' + (e.kind === 'cond' ? 'cond' : '') + (e.kind === 'loop' ? 'flow' : ''), 'marker-end': 'url(#arr)' });
    svg.appendChild(p);
    edgeEls.set(e.from + '>' + e.to, p);
    if (e.label) {
      const c = center(e.from), c2 = center(e.to);
      const t = svgEl('text', { x: (c.x + c2.x) / 2, y: (c.y + c2.y) / 2 - 8, fill: 'var(--muted)', 'font-size': '10', 'text-anchor': 'middle', opacity: .9 });
      t.textContent = e.label; svg.appendChild(t);
    }
  }
}

function setResLabel(id, text, ok) {
  const el = nodeEls.get(id); if (!el) return;
  const st = el.querySelector('.st');
  st.textContent = text;
  if (ok) el.classList.add('done');
}

function setNodeState(id, state) {
  const el = nodeEls.get(id); if (!el) return;
  el.classList.remove('running', 'done', 'failed');
  const st = el.querySelector('.st');
  const dur = el.querySelector('.dur');
  if (state === 'running') { el.classList.add('running'); st.textContent = '运行中'; }
  else if (state === 'done') { el.classList.add('done'); st.textContent = '完成'; el.classList.add('pop'); setTimeout(() => el.classList.remove('pop'), 500); }
  else if (state === 'failed') { el.classList.add('failed'); st.textContent = '失败'; }
  else { st.textContent = '待运行'; }
  if (state === 'running') { el.dataset.started = Date.now(); }
  if ((state === 'done' || state === 'failed') && el.dataset.started) {
    dur.textContent = ((Date.now() - +el.dataset.started) / 1000).toFixed(1) + 's';
  }
}

function edgeState(from, to, state) {
  const el = edgeEls.get(from + '>' + to); if (!el) return;
  el.classList.remove('done', 'active', 'bad');
  const head = el.parentNode?.querySelector?.(`[id=arr] path`);
  if (state === 'done') el.classList.add('done');
  if (state === 'active') el.classList.add('active');
  if (state === 'bad') el.classList.add('bad');
}

let timer = null;
function play() {
  clearTimeout(timer);
  // reset
  for (const n of GRAPH.nodes) setNodeState(n.id, 'pending');
  setNodeState('goal', 'done');
  // resources keep their own labels (outputs: 待产出 / rubric: 只读)
  for (const n of GRAPH.nodes) {
    if (n.kind !== 'res') continue;
    const st = nodeEls.get(n.id)?.querySelector('.st');
    if (st) st.textContent = n.id === 'r-rubric' ? '只读' : '待产出';
  }
  for (const k of edgeEls.keys()) { const el = edgeEls.get(k); el.className.baseVal = 'edge'; }
  $('bar').style.width = '0%'; $('pct').textContent = '0%';
  $('meta').textContent = '0/4 步 · 0.0s'; $('cur').textContent = '等待开始'; $('cur').style.color = '';
  const badge = $('runBadge'); badge.textContent = '运行中'; badge.className = 'badge live';
  const t0 = performance.now();
  const tick = setInterval(() => {
    const s = ((performance.now() - t0) / 1000).toFixed(1);
    $('meta').textContent = `${doneCount()}/4 步 · ${s}s`;
  }, 100);
  let i = 0;
  const step = () => {
    if (i >= SCRIPT.length) {
      clearInterval(tick);
      badge.textContent = '完成'; badge.className = 'badge ok';
      $('bar').style.width = '100%'; $('pct').textContent = '100%';
      $('cur').textContent = '完成 · 2 轮审查 · 修复 3 处'; return;
    }
    const ev = SCRIPT[i++];
    if (ev.run) { setNodeState(ev.run, 'running'); $('cur').textContent = ev.label; setActiveFrom(ev.run); }
    if (ev.done) {
      setNodeState(ev.done, 'done'); markDoneEdges(ev.done);
      if (ev.done === 'collect') setResLabel('r-context', '已产出', true);
      if (ev.done === 'fix') { edgeState('fix', 'review', 'active'); setResLabel('r-review', '已产出', true); $('cur').style.color = ''; }
      if (ev.done === 'review') {
        edgeState('fix', 'review', 'done'); edgeState('review', 'finalize', 'active');
        setResLabel('r-review', '已产出', true);
      }
      if (ev.done === 'finalize') {
        setResLabel('r-verdict', '已产出', true);
        for (const e of GRAPH.edges) edgeState(e.from, e.to, 'done');
      }
    }
    if (ev.fail) { setNodeState(ev.fail, 'failed'); const to = findNext(ev.fail, 'fix'); if (to) edgeState(ev.fail, to, 'bad');
      $('cur').textContent = '审查不通过：3 处必须修，进入修复'; $('cur').style.color = 'var(--bad)'; }
    updateProgress();
    timer = setTimeout(step, i < SCRIPT.length ? SCRIPT[i].t - ev.t : 500);
  };
  // start after a beat, using absolute times
  let started = performance.now();
  const runAt = () => {
    const now = performance.now() - started;
    while (i < SCRIPT.length && SCRIPT[i].t <= now) {
      const ev = SCRIPT[i++];
      if (ev.run) { setNodeState(ev.run, 'running'); $('cur').textContent = ev.label; setActiveFrom(ev.run); }
      if (ev.done) {
      setNodeState(ev.done, 'done'); markDoneEdges(ev.done);
      if (ev.done === 'collect') setResLabel('r-context', '已产出', true);
      if (ev.done === 'fix') { edgeState('fix', 'review', 'active'); setResLabel('r-review', '已产出', true); $('cur').style.color = ''; }
      if (ev.done === 'review') {
        edgeState('fix', 'review', 'done'); edgeState('review', 'finalize', 'active');
        setResLabel('r-review', '已产出', true);
      }
      if (ev.done === 'finalize') {
        setResLabel('r-verdict', '已产出', true);
        for (const e of GRAPH.edges) edgeState(e.from, e.to, 'done');
      }
    }
      if (ev.fail) { setNodeState(ev.fail, 'failed'); const to = findNext(ev.fail, 'fix'); if (to) edgeState(ev.fail, to, 'bad');
      $('cur').textContent = '审查不通过：3 处必须修，进入修复'; $('cur').style.color = 'var(--bad)'; }
      updateProgress();
    }
    if (i < SCRIPT.length) timer = setTimeout(runAt, 60);
    else { clearInterval(tick); badge.textContent = '完成'; badge.className = 'badge ok';
      $('bar').style.width = '100%'; $('pct').textContent = '100%';
      $('cur').textContent = '完成 · 2 轮审查 · 修复 3 处'; $('cur').style.color = 'var(--ok)';
      $('meta').textContent = '4/4 步 · ' + ((performance.now() - t0) / 1000).toFixed(1) + 's'; $('meta').style.color = 'var(--ok)';
      $('bar').style.width = '100%'; $('pct').textContent = '100%'; }
  };
  setTimeout(runAt, 60);
}

function findNext(from, targetId) { return (GRAPH.edges.find((e) => e.from === from && e.to === targetId) || {}).to; }
function doneCount() { let n = 0; for (const [id, el] of nodeEls) { const g = GRAPH.nodes.find((x) => x.id === id); if (g && g.kind === 'step' && el.classList.contains('done')) n++; } return n; }
function updateProgress() { const d = doneCount(); $('bar').style.width = (d / 4 * 100) + '%'; $('pct').textContent = Math.round(d / 4 * 100) + '%'; }
function setActiveFrom(id) { for (const e of GRAPH.edges) if (e.from === id) edgeState(e.from, e.to, 'active'); }
function markDoneEdges(id) { for (const e of GRAPH.edges) if (e.from === id) edgeState(e.from, e.to, 'done'); }

// controls
$('phasesBtn').onclick = () => { document.body.classList.toggle('implicit'); $('phasesBtn').classList.toggle('on'); };
$('themeBtn').onclick = () => { document.body.classList.toggle('dark'); };
$('replayBtn').onclick = play;
$('layoutBtn').onclick = () => {
  // demo auto-layout: nudge positions then settle back (real impl recomputes with ELK)
  for (const n of GRAPH.nodes) {
    const el = nodeEls.get(n.id);
    el.style.transform = `translate(${(Math.random() * 24 - 12).toFixed(0)}px, ${(Math.random() * 16 - 8).toFixed(0)}px) scale(.97)`;
  }
  setTimeout(() => { for (const n of GRAPH.nodes) { const el = nodeEls.get(n.id); el.style.transform = 'translate(0,0) scale(1)'; } }, 220);
};

render();
setTimeout(play, 300);
</script>
</body></html>
